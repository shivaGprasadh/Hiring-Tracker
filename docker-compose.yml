services:
  tracker:
    build: .
    ports:
      - "8800:8000"
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      # Default admin account. Created automatically the first time the app
      # starts with these set and no account for ADMIN_EMAIL exists yet.
      # Change ADMIN_NAME / ADMIN_PASSWORD after the first login (Profile page).
      - ADMIN_EMAIL=admin@schlastc.local
      - ADMIN_NAME=Admin
      - ADMIN_PASSWORD=Adm1n!123
    restart: unless-stopped
